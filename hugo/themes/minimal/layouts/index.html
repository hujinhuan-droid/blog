{{ define "main" }}
<section class="hero">
  <h1>{{ .Site.Title }}</h1>
  <p class="lead">{{ .Site.Params.description }}</p>
</section>
<section class="recent">
  <h2>最新文章</h2>
  <ul class="post-list">
    {{ range first 5 .Site.RegularPages.ByDate.Reverse }}
      <li>
        <a href="{{ .RelPermalink }}">{{ .Title }}</a>
        <time>{{ .Date.Format "2006-01-02" }}</time>
      </li>
    {{ end }}
  </ul>
</section>
{{ end }}
