{{ define "main" }}
<h1>{{ .Title }}</h1>
<ul class="post-list">
  {{ range .Paginator.Pages }}
    <li>
      <a href="{{ .RelPermalink }}">{{ .Title }}</a>
      <time>{{ .Date.Format "2006-01-02" }}</time>
      <p>{{ .Summary }}</p>
    </li>
  {{ end }}
</ul>
{{ template "_internal/pagination.html" . }}
{{ end }}
