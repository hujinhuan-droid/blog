    <h1>Hugo 是什么</h1>
    <time class="post-date">2026-07-22</time>
  </header>
  <div class="post-content">
    <p>之前我们 fork 的 <code>hujinhuan-droid/hugo</code> 其实是 <strong>Hugo 框架本身的源码</strong>，并不是用 Hugo 搭的网站。</p><p>要做一个真正的站点，需要：</p><ol><li><code>hugo new site mysite</code> 生成骨架</li><li>放一个主题（或自己写布局）</li><li>在 <code>content/</code> 里写 Markdown</li><li><code>hugo</code> 构建出 <code>public/</code></li><li>把 <code>public/</code> 部署出去</li></ol><p>本站点就是这样来的。</p>
  </div>
</article>
