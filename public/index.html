<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AI Agent Blog</title>
    <meta name="theme-color" content="#2563eb" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="canonical" href="/" />
    <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="alternate" type="application/rss+xml" title="AI Agent Blog RSS" href="/feed.xml" />
    <!-- 首屏关键脚本：提前发起下载，避免等到 body 末尾才被发现 -->
    <link rel="preload" as="script" href="/js/markdown.min.js" />
    <link rel="preload" as="script" href="/js/app.min.js" />
    <link rel="preload" as="script" href="/js/icons.min.js" />
    <link rel="stylesheet" href="/css/style.min.css" />
  <link rel="stylesheet" href="/css/depth.min.css" />
    <link rel="stylesheet" href="/vendor/highlightjs/atom-one-dark.min.css" />
  </head>
  <body>
    <!-- 景深层：顶部光晕 + 透视网格地面（纯装饰，不承载信息） -->
    <div class="bg-fx" aria-hidden="true"><span class="bg-glow"></span><span class="bg-grid"></span></div>
    <header class="topbar">
      <div class="wrap">
        <a class="brand" href="#/">AI Agent Blog</a>
        <button class="nav-toggle" id="navToggle" aria-label="展开菜单"><i data-lucide="menu"></i></button>
        <nav class="nav" id="nav"></nav>
      </div>
    </header>

    <main id="app" class="container"></main>

    <footer class="footer">
      <div class="wrap">
        <div class="site-stats" id="site-stats"></div>
        <div class="copyright">© AI Agent Blog · Powered by Cloudflare (Pages / Workers / D1 / R2)</div>
      </div>
    </footer>

    <!-- 轻量图标子集（仅本站用到的 47 个，压缩后 10.6KB），替代 452KB 的 lucide.min.js 全量包。
         由 tools/gen-icons.mjs 裁剪生成，保持 createIcons() API 兼容；页面引用的是 build-assets.mjs 产出的 .min.js。 -->
    <script src="/js/icons.min.js"></script>
    <script>
      // Lucide 图标：每次 DOM 变化（含 SPA 路由切换/动态插入）后自动渲染 data-lucide 元素
      (function () {
        var refresh = function () { if (window.lucide) window.lucide.createIcons(); };
        refresh();
        var pending = false;
        var io = new MutationObserver(function () {
          if (pending) return;
          pending = true;
          requestAnimationFrame(function () { pending = false; refresh(); });
        });
        io.observe(document.body, { childList: true, subtree: true });
        window.addEventListener("hashchange", refresh);
      })();
    </script>
    <script src="/js/markdown.min.js"></script>
    <script src="/js/app.min.js"></script>
    <!-- admin.min.js（后台专用）与 highlight.min.js（代码块专用）改为运行时按需加载，见 app.js / markdown.js -->
  </body>
</html>
