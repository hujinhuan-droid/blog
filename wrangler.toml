name = "ai-agent-blog"
compatibility_date = "2024-09-23"
main = "src/worker.ts"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端 GUI）：public/ 目录，SPA 模式回退到 index.html
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 关键：关闭「目录自动匹配 index.html」，使根路径 / 不再被资源管线直接命中（否则绕过 Worker，爬虫拿不到 SSR）。
# 改为 404 -> SPA 回退（回退会进入 Worker），从而让首页也能被服务端预渲染。
html_handling = "none"
# 关键：让所有请求（含 /js、/css、图片等静态资源）先经过 Worker，才能由 Worker 注入
# Cache-Control（按扩展名分级缓存）与安全响应头；否则 Assets 会直接吐出默认 max-age=0 的响应。
run_worker_first = true

# D1 数据库（SQLite，本地用 wrangler dev 自动起本地库）
[[d1_databases]]
binding = "DB"
database_name = "ai-agent-blog"
database_id = "52993bdf-7465-41ae-9522-67da70599d75"

# R2 图床
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-agent-blog-images"

# Workers AI（AI 配图 FLUX / 语义搜索向量嵌入）
[ai]
binding = "AI"

# Vectorize 向量索引（语义检索加速）：D1 embedding 列仍为主存储，此索引为加速副本。
# 双写：发文/更新时 upsert；查询：优先走索引，失败/无结果自动回退 D1 + JS cosine。
# 索引维度必须与 bge-base-en-v1.5 一致（768），度量 cosine。删绑定不影响站点（回退路径完整）。
[[vectorize]]
binding = "VECTORIZE"
index_name = "blog-embeddings"

# 环境变量（密钥请用 `wrangler secret put` 设置，不要写进此文件）
[vars]
APP_URL = "https://hujinhuan.cc.cd"

# 自定义域名 hujinhuan.cc.cd 已创建并启用（Cloudflare 侧持久），不再由 wrangler 重复管理 routes
# 如需再次用 wrangler 管理自定义域，请给 token 加 Zone:Edit 权限后恢复下面的配置：
# [[routes]]
# pattern = "hujinhuan.cc.cd"
# custom_domain = true
