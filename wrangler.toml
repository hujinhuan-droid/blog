name = "ai-agent-blog"
compatibility_date = "2024-09-23"
main = "src/worker.ts"
node_compat = true

# 静态资源（前端 GUI）：public/ 目录，SPA 模式回退到 index.html
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"

# D1 数据库（SQLite，本地用 wrangler dev 自动起本地库）
[[d1_databases]]
binding = "DB"
database_name = "ai-agent-blog"
database_id = "REPLACE_WITH_YOUR_D1_ID"

# R2 图床
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-agent-blog-images"

# 环境变量（密钥请用 `wrangler secret put` 设置，不要写进此文件）
[vars]
APP_URL = "http://localhost:8787"
