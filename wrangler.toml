name = "ai-agent-blog"
compatibility_date = "2024-09-23"
main = "src/worker.ts"
compatibility_flags = ["nodejs_compat"]

# 静态资源（前端 GUI）：public/ 目录，SPA 模式回退到 index.html
[assets]
directory = "public"
binding = "ASSETS"
not_found_handling = "single-page-application"
# 关键：关闭「目录自动匹配 index.html」，使根路径 / 不再被资源管线直接命中（否则绕过 Worker，爬虫拿不到 SSR）。
# 改为 404 -> SPA 回退（回退会进入 Worker），从而让首页也能被服务端预渲染。
html_handling = "none"

# D1 数据库（SQLite，本地用 wrangler dev 自动起本地库）
[[d1_databases]]
binding = "DB"
database_name = "ai-agent-blog"
database_id = "52993bdf-7465-41ae-9522-67da70599d75"

# R2 图床
[[r2_buckets]]
binding = "BUCKET"
bucket_name = "ai-agent-blog-images"

# Workers AI（AI 配图 FLUX / 语义搜索向量嵌入）
[ai]
binding = "AI"

# 环境变量（密钥请用 `wrangler secret put` 设置，不要写进此文件）
[vars]
APP_URL = "https://hujinhuan.cc.cd"

# 自定义域名 hujinhuan.cc.cd 已创建并启用（Cloudflare 侧持久），不再由 wrangler 重复管理 routes
# 如需再次用 wrangler 管理自定义域，请给 token 加 Zone:Edit 权限后恢复下面的配置：
# [[routes]]
# pattern = "hujinhuan.cc.cd"
# custom_domain = true
